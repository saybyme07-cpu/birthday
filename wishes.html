<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SayByMe – Birthday Wishes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #9b1c4a;
    --rose: #e8236f;
    --rose-dark: #b3124d;
    --mauve: #5c4a57;
    --pill: #b0194f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #f9cfe0;
    touch-action: none;
    font-family: 'Nunito', system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen {
    position: relative;
    width: min(100vw, 430px);
    height: min(100dvh, 900px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    background: radial-gradient(ellipse at 50% 25%, #fff7fa 0%, #fdf0f4 55%, #fce3ee 100%);
    padding: 24px 18px 20px;
    user-select: none;
    -webkit-user-select: none;
  }
  @media (min-width: 520px) {
    .screen {
      border-radius: 44px;
      box-shadow: 0 30px 80px rgba(160, 40, 90, 0.28);
    }
  }

  @media (max-width: 480px) {
    .screen {
      padding: 16px 14px 14px;
    }
    .wish-title {
      font-size: 24px;
    }
    .gif-stage-container {
      width: clamp(170px, 48vw, 210px);
      height: clamp(170px, 48vw, 210px);
    }
    .celebration-cheer {
      font-size: 21px;
    }
  }

  /* Embedded Mode (inside phone preview mockup) */
  body.embedded {
    background: transparent !important;
    width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
  }
  body.embedded .screen {
    width: 100% !important;
    height: 100% !important;
    border-radius: 38px !important;
    box-shadow: none !important;
    padding: 18px 14px 14px !important;
  }
  body.embedded .wish-title {
    font-size: 24px !important;
  }
  body.embedded .gif-stage-container {
    width: clamp(160px, 44vw, 195px) !important;
    height: clamp(160px, 44vw, 195px) !important;
  }
  body.embedded .celebration-banner {
    margin: 2px 0 6px !important;
  }
  body.embedded .celebration-cheer {
    font-size: 19px !important;
  }

  /* Top Nav Bar */
  .top-nav {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 30;
    margin-top: 4px;
  }
  .btn-phone-sound {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background-color: #ffffff;
    border: 3px solid #f9cadf;
    box-shadow: 0 3px 12px rgba(122, 22, 70, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    user-select: none;
    outline: none;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.2s ease,
                border-color 0.2s ease;
  }
  .btn-phone-sound:hover {
    transform: scale(1.08);
    border-color: #f7b5d2;
  }
  .btn-phone-sound:active {
    transform: scale(0.92);
  }
  .btn-phone-sound .speaker-svg {
    width: 20px;
    height: 20px;
    display: block;
    pointer-events: none;
  }
  body.embedded .btn-phone-sound,
  body.embedded #btn-sound-toggle {
    display: none !important;
  }
  .btn-nav-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 13px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(232, 35, 111, 0.22);
    border-radius: 999px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--crimson);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    transition: transform 0.2s, background 0.2s;
  }
  .btn-nav-back:hover {
    transform: scale(1.04);
    background: #ffffff;
  }

  /* Header Section */
  .header-wrap {
    text-align: center;
    margin-top: 6px;
    z-index: 10;
  }
  .wish-badge {
    display: inline-block;
    padding: 3px 12px;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(232, 35, 111, 0.2);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--rose-dark);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .wish-title {
    font-family: 'Kaushan Script', cursive;
    color: var(--crimson);
    font-size: clamp(23px, 6.5vw, 28px);
    font-weight: 400;
    line-height: 1.15;
    margin: 0;
  }
  .highlight-name {
    color: var(--rose);
  }

  /* Main Stage Container */
  .main-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    z-index: 10;
    margin: auto 0;
  }

  /* Animated Tenor GIF Card */
  .celebration-center {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 8px 0 14px;
  }
  .gif-stage-container {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 26px;
    overflow: visible;
    box-shadow:
      0 16px 36px rgba(160, 27, 78, 0.22),
      0 0 0 4px rgba(255, 255, 255, 0.9),
      0 0 20px rgba(232, 35, 111, 0.2);
    background: #ffffff;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    animation: celebrationFloat 4s ease-in-out infinite alternate;
  }
  .gif-stage-container:hover {
    transform: scale(1.05);
    box-shadow:
      0 20px 42px rgba(160, 27, 78, 0.28),
      0 0 0 5px rgba(255, 255, 255, 0.95),
      0 0 28px rgba(232, 35, 111, 0.35);
  }
  .gif-stage-container:active {
    transform: scale(0.97);
  }
  .birthday-gif {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 22px;
    display: block;
  }

  /* Micro-sparkle accents */
  .spk {
    position: absolute;
    pointer-events: none;
    user-select: none;
    z-index: 5;
    line-height: 1;
    filter: drop-shadow(0 2px 6px rgba(247, 178, 74, 0.6));
    animation: sparkleTwinkle 2.6s ease-in-out infinite alternate;
  }
  .spk-1 { top: -14px; left: -14px; font-size: 22px; color: #ff6b8b; animation-delay: 0s; }
  .spk-2 { top: -12px; right: -14px; font-size: 20px; color: #ffd166; animation-delay: 0.8s; }
  .spk-3 { bottom: -14px; left: -12px; font-size: 20px; color: #f45b9a; animation-delay: 1.4s; }
  .spk-4 { bottom: -12px; right: -12px; font-size: 24px; color: #ffd166; animation-delay: 2s; }

  @keyframes sparkleTwinkle {
    0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.7; }
    50% { transform: scale(1.3) rotate(20deg); opacity: 1; }
  }

  @keyframes celebrationFloat {
    0% { transform: translateY(0); }
    100% { transform: translateY(-7px); }
  }

  /* Celebration Cheer Banner */
  .celebration-banner {
    width: 100%;
    max-width: 320px;
    text-align: center;
    margin: 4px 0 10px;
    padding: 0 10px;
  }
  .celebration-cheer {
    font-family: 'Caveat', cursive;
    font-size: clamp(20px, 5.5vw, 24px);
    font-weight: 700;
    color: var(--crimson);
    line-height: 1.25;
    text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
    animation: cheerPulse 3s ease-in-out infinite alternate;
  }
  @keyframes cheerPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); color: var(--rose); }
  }

  /* Balloon Hint Pill */
  .balloon-prompt {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    padding: 6px 16px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    color: #6b3f55;
    border: 1px dashed rgba(232, 35, 111, 0.35);
    box-shadow: 0 3px 10px rgba(232, 35, 111, 0.1);
    animation: gentlePulse 2.4s ease-in-out infinite;
  }
  @keyframes gentlePulse {
    0%, 100% { transform: scale(1); opacity: 0.92; }
    50% { transform: scale(1.04); opacity: 1; }
  }

  /* Celebration Finale Card (Appears after popping all balloons) */
  .celebration-finale {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 92%;
    max-width: 320px;
    margin: 8px auto 0;
    padding: 14px 18px 12px;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 22px;
    border: 2px solid rgba(232, 35, 111, 0.35);
    box-shadow: 0 12px 32px rgba(232, 35, 111, 0.22), 0 0 20px rgba(247, 178, 74, 0.25);
    text-align: center;
    z-index: 25;
    animation: finalePop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .celebration-finale.show {
    display: flex;
  }
  .finale-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: linear-gradient(90deg, #e8236f, #b3124d);
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    box-shadow: 0 4px 12px rgba(232, 35, 111, 0.25);
    margin-bottom: 4px;
  }
  .finale-title {
    font-family: 'Kaushan Script', cursive;
    font-size: 23px;
    color: var(--crimson);
    line-height: 1.2;
    margin: 3px 0;
  }
  .finale-text {
    font-size: 13.5px;
    font-weight: 700;
    color: #5a1d3a;
    line-height: 1.35;
    margin-bottom: 2px;
  }
  @keyframes finalePop {
    0% { transform: scale(0.65) translateY(24px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* Interactive Floating Balloons Layer */
  .balloons-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    overflow: hidden;
  }
  .balloon {
    position: absolute;
    cursor: pointer;
    pointer-events: auto;
    width: 46px;
    height: 56px;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    transition: transform 0.2s ease, opacity 0.3s ease;
    animation: balloonFloat 4s ease-in-out infinite alternate;
  }
  .balloon::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 10px;
    width: 8px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    transform: rotate(-25deg);
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 6px solid inherit;
  }
  .balloon-string {
    position: absolute;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
    width: 1.5px;
    height: 48px;
    background: rgba(160, 27, 78, 0.35);
  }

  /* Specific Balloon Placements */
  .balloon-1 {
    top: 90px;
    left: 12px;
    background: #f27fb0;
    border-bottom-color: #f27fb0;
    animation-duration: 3.8s;
  }
  .balloon-2 {
    top: 75px;
    right: 14px;
    background: #ffb703;
    border-bottom-color: #ffb703;
    animation-duration: 4.4s;
    animation-delay: -1.2s;
  }
  .balloon-3 {
    bottom: 120px;
    left: 14px;
    background: #a77ad8;
    border-bottom-color: #a77ad8;
    animation-duration: 4.1s;
    animation-delay: -0.8s;
  }
  .balloon-4 {
    bottom: 135px;
    right: 12px;
    background: #e8236f;
    border-bottom-color: #e8236f;
    animation-duration: 4.6s;
    animation-delay: -2s;
  }

  @keyframes balloonFloat {
    0% { transform: translateY(0) rotate(-3deg); }
    100% { transform: translateY(-14px) rotate(4deg); }
  }

  /* Balloon Click Popped Animation */
  .balloon.popped {
    transform: translateY(-900px) scale(1.4) !important;
    opacity: 0 !important;
    transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease !important;
  }

  /* Confetti FX Canvas */
  #fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 25;
  }
</style>
</head>
<body>
<div class="screen" id="screen">
  <!-- Top Nav Bar -->
  <div class="top-nav">
    <button type="button" class="btn-nav-back" id="btn-back"><span>←</span> Letter</button>
    <button type="button" class="btn-phone-sound" id="btn-sound-toggle" aria-label="Toggle Sound" title="Toggle Sound">
      <svg class="speaker-svg" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M13 6.8 L7.6 10.6 H4 C3.45 10.6 3 11.05 3 11.6 V16.4 C3 16.95 3.45 17.4 4 17.4 H7.6 L13 21.2 Z" stroke="#671038" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M16.8 10.6 C18.1 11.6 18.8 12.7 18.8 14 C18.8 15.3 18.1 16.4 16.8 17.4" stroke="#671038" stroke-width="2.3" stroke-linecap="round" fill="none"/>
        <path d="M20.4 7.6 C22.6 9.5 23.8 11.6 23.8 14 C23.8 16.4 22.6 18.5 20.4 20.4" stroke="#671038" stroke-width="2.3" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
  </div>

  <!-- Header Section -->
  <div class="header-wrap">
    <div class="wish-badge">🎉 Birthday Celebration 🎉</div>
    <h1 class="wish-title">Happy Birthday, <span class="highlight-name" id="name-display">Sanjana</span>! 🎂</h1>
  </div>

  <!-- Interactive Floating Balloons Layer -->
  <div class="balloons-layer" id="balloons-layer">
    <div class="balloon balloon-1" title="Tap balloon to celebrate!" data-color="#f27fb0">
      <div class="balloon-string"></div>
    </div>
    <div class="balloon balloon-2" title="Tap balloon to celebrate!" data-color="#ffb703">
      <div class="balloon-string"></div>
    </div>
    <div class="balloon balloon-3" title="Tap balloon to celebrate!" data-color="#a77ad8">
      <div class="balloon-string"></div>
    </div>
    <div class="balloon balloon-4" title="Tap balloon to celebrate!" data-color="#e8236f">
      <div class="balloon-string"></div>
    </div>
  </div>

  <!-- Main Stage: Celebration Center -->
  <div class="main-stage">
    <div class="celebration-center">
      <div class="gif-stage-container" id="gif-card" title="Tap for celebration confetti!">
        <img src="assets/birthday_tenor.gif" onerror="this.src='https://media1.tenor.com/m/8-dHMrnA-XgAAAAC/birthday-happy-birthday.gif'" alt="Happy Birthday Celebration GIF" class="birthday-gif">
        <!-- Floating sparkle accents -->
        <span class="spk spk-1">✦</span>
        <span class="spk spk-2">✨</span>
        <span class="spk spk-3">★</span>
        <span class="spk spk-4">✦</span>
      </div>
    </div>

    <!-- Celebration Cheer Line -->
    <div class="celebration-banner">
      <p class="celebration-cheer">Sending you the warmest smiles & sweetest wishes! 💖</p>
    </div>

    <div class="balloon-prompt" id="balloon-prompt">
      <span class="pulse-icon">🎈</span> Tap balloons to pop celebrations! 🎈
    </div>

    <!-- Celebration Finale Card (Reveals after popping all balloons) -->
    <div class="celebration-finale" id="celebration-finale">
      <div class="finale-badge">🎊 Best Birthday Ever! 🎊</div>
      <h2 class="finale-title">Happy Birthday, <span class="finale-name"></span>! 🎂</h2>
      <p class="finale-text">May all your wishes come true and your year be filled with nonstop joy! 💖</p>
    </div>
  </div>

  <!-- Particle Confetti Canvas -->
  <canvas id="fx"></canvas>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  /* ---------- URL params ---------- */
  const params = new URLSearchParams(location.search);
  const toName = params.get('to') || 'Sanjana';
  const fromName = params.get('from') || 'Rohan';
  const userRel = params.get('rel') || 'Girlfriend';
  const date = params.get('date') || '';
  const chosenWish = params.get('wish') || params.get('msg') || 'You make ordinary days feel like celebrations.';

  // Populate dynamic text
  if ($('#name-display')) $('#name-display').textContent = toName;
  if ($('#wish-text-content')) $('#wish-text-content').textContent = `"${chosenWish}"`;
  if ($('#sender-name')) $('#sender-name').textContent = fromName || 'Someone special';

  // Back button: returns to personal letter view
  $('#btn-back').addEventListener('click', (e) => {
    e.preventDefault();
    if (window.parent && window.parent !== window) {
      if (typeof window.parent.switchToMessageView === 'function') {
        window.parent.switchToMessageView();
        return;
      }
      window.parent.postMessage({ type: 'SAYBYME_SWITCH_VIEW', view: 'message' }, '*');
      return;
    }
    location.href = 'message.html?' + params.toString();
  });

  // Balloon Popping Logic: STAYS ON THIS PAGE!
  let poppedCount = 0;
  const totalBalloons = $$('.balloon').length;
  const promptEl = $('.balloon-prompt');
  const popReactions = ['✨ Pop!', '🎉 Yay!', '💖 Love!', '🎂 Sweet!'];

  // Balloon click listener: Pops the balloon with confetti & stay on this page!
  $$('.balloon').forEach((balloon, index) => {
    balloon.addEventListener('click', (e) => {
      e.stopPropagation();
      if (balloon.classList.contains('popped')) return;

      balloon.classList.add('popped');
      poppedCount++;

      // Play audio pop sound chime
      playPopChime();

      // Confetti burst from the popped balloon's position
      const rect = balloon.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      burstConfetti(originX, originY, 40);

      // Show floating reaction text
      showFloatingText(popReactions[index % popReactions.length], originX, originY);

      // Update prompt text or trigger grand celebration finale
      if (poppedCount < totalBalloons) {
        if (promptEl) {
          promptEl.innerHTML = `<span class="pulse-icon">🎈</span> Popped ${poppedCount} of ${totalBalloons}! Tap more! ✨`;
        }
      } else {
        triggerGrandFinale();
      }
    });
  });

  // Grand Celebration Finale when all balloons popped
  function triggerGrandFinale() {
    if (promptEl) promptEl.style.display = 'none';
    const finale = $('#celebration-finale');
    if (finale) {
      finale.classList.add('show');
      const nameSpan = finale.querySelector('.finale-name');
      if (nameSpan) nameSpan.textContent = toName;
    }

    playFanfareChime();

    // Celebration cannon confetti bursts
    burstConfetti(W * 0.25, H * 0.45, 50);
    burstConfetti(W * 0.75, H * 0.45, 50);
    burstConfetti(W * 0.5, H * 0.35, 60);

    setTimeout(() => {
      burstConfetti(W * 0.35, H * 0.5, 45);
      burstConfetti(W * 0.65, H * 0.5, 45);
    }, 320);

    setTimeout(() => {
      burstConfetti(W * 0.5, H * 0.4, 50);
    }, 650);
  }

  // Floating text feedback on pop
  function showFloatingText(text, x, y) {
    const el = document.createElement('div');
    el.textContent = text;
    el.style.position = 'fixed';
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    el.style.transform = 'translate(-50%, -50%)';
    el.style.fontFamily = "'Kaushan Script', cursive";
    el.style.fontSize = '20px';
    el.style.fontWeight = 'bold';
    el.style.color = '#e8236f';
    el.style.pointerEvents = 'none';
    el.style.zIndex = '99';
    el.style.textShadow = '0 2px 8px rgba(255,255,255,0.9)';
    el.style.transition = 'all 0.65s cubic-bezier(0.2, 0.8, 0.2, 1)';
    document.body.appendChild(el);

    requestAnimationFrame(() => {
      el.style.transform = 'translate(-50%, -85px) scale(1.2)';
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 700);
  }

  /* ---------- Web Audio Pop Chime & Fanfare ---------- */
  function playFanfareChime() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.22, ctx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + idx * 0.1);
        osc.stop(ctx.currentTime + idx * 0.1 + 0.35);
      });
    } catch (e) {}
  }

  /* ---------- Web Audio Pop Chime ---------- */
  function playPopChime() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch (e) {}
  }

  /* ---------- Canvas Confetti ---------- */
  const cv = $('#fx');
  const ctx = cv.getContext('2d');
  let W, H;
  const resize = () => {
    W = cv.width = cv.clientWidth || 350;
    H = cv.height = cv.clientHeight || 680;
  };
  window.addEventListener('resize', resize);
  resize();

  const particles = [];
  const colors = ['#f45b9a', '#f7b24a', '#5bc0e8', '#a77ad8', '#ffffff', '#ff6b8b'];

  // Ambient gentle celebratory drifting particles
  const ambientConfetti = [];
  for (let i = 0; i < 22; i++) {
    ambientConfetti.push({
      x: Math.random() * (W || 360),
      y: Math.random() * (H || 680),
      vx: (Math.random() - 0.5) * 0.45,
      vy: 0.35 + Math.random() * 0.55,
      size: 2.5 + Math.random() * 3.5,
      color: colors[(Math.random() * colors.length) | 0],
      alpha: 0.25 + Math.random() * 0.35,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 2
    });
  }

  function burstConfetti(ox, oy, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2.5 + Math.random() * 5.5;
      particles.push({
        x: ox,
        y: oy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2.5,
        size: 4 + Math.random() * 5,
        color: colors[(Math.random() * colors.length) | 0],
        alpha: 1,
        decay: 0.02 + Math.random() * 0.025,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 12
      });
    }
  }

  // Tapping central GIF also creates a celebratory burst
  const gifCard = $('#gif-card');
  if (gifCard) {
    gifCard.addEventListener('click', () => {
      const rect = gifCard.getBoundingClientRect();
      burstConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2, 35);
      playPopChime();
    });
  }

  function renderAmbient() {
    for (let p of ambientConfetti) {
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      if (p.y > H + 10) {
        p.y = -10;
        p.x = Math.random() * W;
      }
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  function renderConfetti() {
    ctx.clearRect(0, 0, W, H);
    renderAmbient();

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12; // gravity
      p.alpha -= p.decay;
      p.rotation += p.rotSpeed;

      if (p.alpha > 0) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      } else {
        particles.splice(i, 1);
      }
    }
    requestAnimationFrame(renderConfetti);
  }
  requestAnimationFrame(renderConfetti);

  // Embedded mode detection
  if (window.self !== window.top || params.get('embedded') === '1') {
    document.body.classList.add('embedded');
  }
})();
</script>
<script src="bg-music.js"></script>
</body>
