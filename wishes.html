<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SayByMe – Birthday Wishes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #9b1c4a;
    --rose: #e8236f;
    --rose-dark: #b3124d;
    --mauve: #5c4a57;
    --pill: #b0194f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #f9cfe0;
    touch-action: none;
    font-family: 'Nunito', system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen {
    position: relative;
    width: min(100vw, 430px);
    height: min(100dvh, 900px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    background: radial-gradient(ellipse at 50% 25%, #fff7fa 0%, #fdf0f4 55%, #fce3ee 100%);
    padding: 24px 18px 20px;
    user-select: none;
    -webkit-user-select: none;
  }
  @media (min-width: 520px) {
    .screen {
      border-radius: 44px;
      box-shadow: 0 30px 80px rgba(160, 40, 90, 0.28);
    }
  }

  /* Embedded Mode (inside phone preview mockup) */
  body.embedded {
    background: transparent !important;
    width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
  }
  body.embedded .screen {
    width: 100% !important;
    height: 100% !important;
    border-radius: 38px !important;
    box-shadow: none !important;
    padding: 24px 16px 18px !important;
  }

  /* Top Nav Bar */
  .top-nav {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 30;
    margin-top: 4px;
  }
  .btn-nav-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 13px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(232, 35, 111, 0.22);
    border-radius: 999px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--crimson);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    transition: transform 0.2s, background 0.2s;
  }
  .btn-nav-back:hover {
    transform: scale(1.04);
    background: #ffffff;
  }

  /* Header Section */
  .header-wrap {
    text-align: center;
    margin-top: 6px;
    z-index: 10;
  }
  .wish-badge {
    display: inline-block;
    padding: 3px 12px;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(232, 35, 111, 0.2);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--rose-dark);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .wish-title {
    font-family: 'Kaushan Script', cursive;
    color: var(--crimson);
    font-size: clamp(23px, 6.5vw, 28px);
    font-weight: 400;
    line-height: 1.15;
    margin: 0;
  }
  .highlight-name {
    color: var(--rose);
  }

  /* Main Stage Container */
  .main-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    z-index: 10;
    margin: auto 0;
  }

  /* Animated Tenor GIF Card */
  .gif-stage-container {
    position: relative;
    width: 180px;
    height: 180px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow:
      0 12px 28px rgba(160, 27, 78, 0.22),
      0 0 0 3px rgba(255, 255, 255, 0.85);
    background: #ffffff;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .gif-stage-container:hover {
    transform: scale(1.04);
  }
  .birthday-gif {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Chosen Wish Display Card */
  .wish-quote-card {
    position: relative;
    width: 100%;
    max-width: 310px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1.5px solid rgba(246, 192, 214, 0.8);
    border-radius: 20px;
    padding: 14px 16px 12px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(160, 27, 78, 0.08);
  }
  .quote-sparkle {
    font-size: 16px;
    color: #f7b24a;
    margin-bottom: 2px;
  }
  .wish-quote-text {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    font-weight: 700;
    color: #4a122e;
    line-height: 1.35;
    margin-bottom: 6px;
  }
  .wish-sender-line {
    font-size: 12px;
    font-weight: 700;
    color: var(--rose);
  }

  /* Balloon Hint Pill */
  .balloon-prompt {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 4px 12px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    color: #6b3f55;
    border: 1px dashed rgba(232, 35, 111, 0.3);
    animation: gentlePulse 2s ease-in-out infinite;
  }
  @keyframes gentlePulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.03); opacity: 1; }
  }

  /* Bottom Actions */
  .bottom-actions {
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 20;
    margin-top: 8px;
  }
  .btn-blow-candles {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 86%;
    max-width: 270px;
    padding: 12px 24px;
    background: linear-gradient(90deg, #e8236f 0%, #b3124d 100%);
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(232, 35, 111, 0.42);
    transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .btn-blow-candles:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 12px 28px rgba(232, 35, 111, 0.55);
  }

  /* Interactive Floating Balloons Layer */
  .balloons-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    overflow: hidden;
  }
  .balloon {
    position: absolute;
    cursor: pointer;
    pointer-events: auto;
    width: 46px;
    height: 56px;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    transition: transform 0.2s ease, opacity 0.3s ease;
    animation: balloonFloat 4s ease-in-out infinite alternate;
  }
  .balloon::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 10px;
    width: 8px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    transform: rotate(-25deg);
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 6px solid inherit;
  }
  .balloon-string {
    position: absolute;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
    width: 1.5px;
    height: 48px;
    background: rgba(160, 27, 78, 0.35);
  }

  /* Specific Balloon Placements */
  .balloon-1 {
    top: 90px;
    left: 12px;
    background: #f27fb0;
    border-bottom-color: #f27fb0;
    animation-duration: 3.8s;
  }
  .balloon-2 {
    top: 75px;
    right: 14px;
    background: #ffb703;
    border-bottom-color: #ffb703;
    animation-duration: 4.4s;
    animation-delay: -1.2s;
  }
  .balloon-3 {
    bottom: 120px;
    left: 14px;
    background: #a77ad8;
    border-bottom-color: #a77ad8;
    animation-duration: 4.1s;
    animation-delay: -0.8s;
  }
  .balloon-4 {
    bottom: 135px;
    right: 12px;
    background: #e8236f;
    border-bottom-color: #e8236f;
    animation-duration: 4.6s;
    animation-delay: -2s;
  }

  @keyframes balloonFloat {
    0% { transform: translateY(0) rotate(-3deg); }
    100% { transform: translateY(-14px) rotate(4deg); }
  }

  /* Balloon Click Popped Animation */
  .balloon.popped {
    transform: translateY(-900px) scale(1.4) !important;
    opacity: 0 !important;
    transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease !important;
  }

  /* Confetti FX Canvas */
  #fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 25;
  }
</style>
</head>
<body>
<div class="screen" id="screen">
  <!-- Top Nav Bar -->
  <div class="top-nav">
    <button type="button" class="btn-nav-back" id="btn-back"><span>←</span> Letter</button>
  </div>

  <!-- Header Section -->
  <div class="header-wrap">
    <div class="wish-badge">✨ Birthday Wish ✨</div>
    <h1 class="wish-title">Happy Birthday, <span class="highlight-name" id="name-display">Sanjana</span>! 🎂</h1>
  </div>

  <!-- Interactive Floating Balloons Layer -->
  <div class="balloons-layer" id="balloons-layer">
    <div class="balloon balloon-1" title="Tap balloon to blow the candles!" data-color="#f27fb0">
      <div class="balloon-string"></div>
    </div>
    <div class="balloon balloon-2" title="Tap balloon to blow the candles!" data-color="#ffb703">
      <div class="balloon-string"></div>
    </div>
    <div class="balloon balloon-3" title="Tap balloon to blow the candles!" data-color="#a77ad8">
      <div class="balloon-string"></div>
    </div>
    <div class="balloon balloon-4" title="Tap balloon to blow the candles!" data-color="#e8236f">
      <div class="balloon-string"></div>
    </div>
  </div>

  <!-- Main Stage: Tenor GIF & Chosen Wish Card -->
  <div class="main-stage">
    <!-- Animated Tenor GIF -->
    <div class="gif-stage-container" id="gif-card" title="Tap to blow the candles!">
      <img src="assets/birthday_tenor.gif" onerror="this.src='https://media1.tenor.com/m/8-dHMrnA-XgAAAAC/birthday-happy-birthday.gif'" alt="Happy Birthday Celebration GIF" class="birthday-gif">
    </div>

    <!-- Chosen Wish Card (from entry) -->
    <div class="wish-quote-card">
      <div class="quote-sparkle">✨ 💖 ✨</div>
      <p class="wish-quote-text" id="wish-text-content">"You make ordinary days feel like celebrations."</p>
      <div class="wish-sender-line">— With love, <span id="sender-name">Rohan</span> 💕</div>
    </div>

    <div class="balloon-prompt">
      <span class="pulse-icon">🎈</span> Tap balloons to pop them! 🎈
    </div>
  </div>

  <!-- Bottom Action Button -->
  <div class="bottom-actions">
    <button class="btn-blow-candles" id="btn-blow-candles" type="button">
      <span>Blow the Candles</span> 🎂 →
    </button>
  </div>

  <!-- Particle Confetti Canvas -->
  <canvas id="fx"></canvas>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  /* ---------- URL params ---------- */
  const params = new URLSearchParams(location.search);
  const toName = params.get('to') || 'Sanjana';
  const fromName = params.get('from') || 'Rohan';
  const userRel = params.get('rel') || 'Girlfriend';
  const date = params.get('date') || '';
  const chosenWish = params.get('wish') || params.get('msg') || 'You make ordinary days feel like celebrations.';

  // Populate dynamic text
  $('#name-display').textContent = toName;
  $('#wish-text-content').textContent = `"${chosenWish}"`;
  $('#sender-name').textContent = fromName || 'Someone special';

  // Back button: returns to personal letter view
  $('#btn-back').addEventListener('click', (e) => {
    e.preventDefault();
    if (window.parent && window.parent !== window) {
      if (typeof window.parent.switchToMessageView === 'function') {
        window.parent.switchToMessageView();
        return;
      }
      window.parent.postMessage({ type: 'SAYBYME_SWITCH_VIEW', view: 'message' }, '*');
      return;
    }
    location.href = 'message.html?' + params.toString();
  });

  // Balloon Popping Logic: STAYS ON THIS PAGE!
  let poppedCount = 0;
  const totalBalloons = $$('.balloon').length;
  const promptEl = $('.balloon-prompt');
  const popReactions = ['✨ Pop!', '🎉 Yay!', '💖 Love!', '🎂 Sweet!'];

  // Balloon click listener: Pops the balloon with confetti & stay on this page!
  $$('.balloon').forEach((balloon, index) => {
    balloon.addEventListener('click', (e) => {
      e.stopPropagation();
      if (balloon.classList.contains('popped')) return;

      balloon.classList.add('popped');
      poppedCount++;

      // Play audio pop sound chime
      playPopChime();

      // Confetti burst from the popped balloon's position
      const rect = balloon.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      burstConfetti(originX, originY, 40);

      // Show floating reaction text
      showFloatingText(popReactions[index % popReactions.length], originX, originY);

      // Update prompt text - STAYS ON THIS PAGE!
      if (promptEl) {
        if (poppedCount < totalBalloons) {
          promptEl.innerHTML = `<span class="pulse-icon">🎈</span> Popped ${poppedCount} of ${totalBalloons}! Tap more! ✨`;
        } else {
          promptEl.innerHTML = `<span class="pulse-icon">🎉</span> All balloons popped! Tap below to blow candles 🎂`;
          promptEl.style.background = 'rgba(255, 230, 240, 0.95)';
          promptEl.style.borderColor = '#e8236f';
        }
      }
    });
  });

  // Floating text feedback on pop
  function showFloatingText(text, x, y) {
    const el = document.createElement('div');
    el.textContent = text;
    el.style.position = 'fixed';
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    el.style.transform = 'translate(-50%, -50%)';
    el.style.fontFamily = "'Kaushan Script', cursive";
    el.style.fontSize = '20px';
    el.style.fontWeight = 'bold';
    el.style.color = '#e8236f';
    el.style.pointerEvents = 'none';
    el.style.zIndex = '99';
    el.style.textShadow = '0 2px 8px rgba(255,255,255,0.9)';
    el.style.transition = 'all 0.65s cubic-bezier(0.2, 0.8, 0.2, 1)';
    document.body.appendChild(el);

    requestAnimationFrame(() => {
      el.style.transform = 'translate(-50%, -85px) scale(1.2)';
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 700);
  }

  // Navigation to Candle page ONLY when clicking the bottom button!
  let isNavigating = false;
  function goToCandlesPage() {
    if (isNavigating) return;
    isNavigating = true;

    // Pop any remaining balloons in celebratory wave
    $$('.balloon:not(.popped)').forEach((b, idx) => {
      setTimeout(() => b.classList.add('popped'), idx * 50);
    });

    playPopChime();
    burstConfetti(window.innerWidth / 2, window.innerHeight * 0.45, 50);

    setTimeout(() => {
      if (window.parent && window.parent !== window) {
        if (typeof window.parent.switchToCandleView === 'function') {
          window.parent.switchToCandleView();
          isNavigating = false;
          return;
        }
        window.parent.postMessage({ type: 'SAYBYME_SWITCH_VIEW', view: 'candle' }, '*');
        isNavigating = false;
        return;
      }
      location.href = 'candle.html?' + params.toString();
    }, 280);
  }

  // Bottom action button: explicitly navigates to candle blowout
  $('#btn-blow-candles').addEventListener('click', goToCandlesPage);

  /* ---------- Web Audio Pop Chime ---------- */
  function playPopChime() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch (e) {}
  }

  /* ---------- Canvas Confetti ---------- */
  const cv = $('#fx');
  const ctx = cv.getContext('2d');
  let W, H;
  const resize = () => {
    W = cv.width = cv.clientWidth || 350;
    H = cv.height = cv.clientHeight || 680;
  };
  window.addEventListener('resize', resize);
  resize();

  const particles = [];
  const colors = ['#f45b9a', '#f7b24a', '#5bc0e8', '#a77ad8', '#ffffff', '#ff6b8b'];

  function burstConfetti(ox, oy, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2.5 + Math.random() * 5.5;
      particles.push({
        x: ox,
        y: oy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2.5,
        size: 4 + Math.random() * 5,
        color: colors[(Math.random() * colors.length) | 0],
        alpha: 1,
        decay: 0.02 + Math.random() * 0.025,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 12
      });
    }
    if (!animating) requestAnimationFrame(renderConfetti);
  }

  let animating = false;
  function renderConfetti() {
    ctx.clearRect(0, 0, W, H);
    let alive = false;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12; // gravity
      p.alpha -= p.decay;
      p.rotation += p.rotSpeed;

      if (p.alpha > 0) {
        alive = true;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      } else {
        particles.splice(i, 1);
      }
    }
    if (alive) {
      animating = true;
      requestAnimationFrame(renderConfetti);
    } else {
      animating = false;
    }
  }

  // Embedded mode detection
  if (window.self !== window.top || params.get('embedded') === '1') {
    document.body.classList.add('embedded');
  }
})();
</script>
</body>
</html>
