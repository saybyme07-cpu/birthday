<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SayByMe – A Special Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Caveat:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--crimson:#9b1c4a;--rose:#e8236f;--mauve:#5c4a57;--w:min(88vw,380px,42vh)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#f9cfe0}
  body{display:flex;align-items:center;justify-content:center;font-family:'Nunito',system-ui,sans-serif}
  .screen{
    position:relative;width:min(100vw,430px);height:min(100dvh,900px);overflow:hidden;display:flex;flex-direction:column;
    background:radial-gradient(ellipse at 50% 40%,#fff0f6 0%,transparent 62%),linear-gradient(180deg,#f9cadc,#f8c6da 60%,#f9cde0);
  }
  @media(min-width:520px){.screen{border-radius:44px;box-shadow:0 30px 80px rgba(160,40,90,.28)}}

  /* Top Navigation Bar */
  .top-nav {
    position: absolute;
    top: 14px;
    left: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .btn-nav-back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(232, 35, 111, 0.25);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--crimson);
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(160, 40, 90, 0.08);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .btn-nav-back:hover {
    background: #ffffff;
    transform: scale(1.04);
  }

  /* header */
  .top{position:relative;z-index:4;text-align:center;padding:clamp(70px,11vh,110px) 20px 0}
  .mail{width:56px;height:46px;display:block;margin:0 auto 12px;fill:none;stroke:var(--crimson);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  h1{font-family:'Kaushan Script',cursive;font-weight:400;color:var(--crimson);font-size:clamp(40px,12.4vw,54px);line-height:1.1}
  .sub{margin-top:8px;font-size:clamp(18px,5.4vw,23px);font-weight:600;color:var(--mauve)}
  .divider{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}
  .divider i{display:block;width:30%;height:1.5px;background:var(--crimson);opacity:.55}
  .divider svg{width:24px;height:22px;fill:#d93a6a;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.12)}}

  .deco{position:absolute;z-index:1;pointer-events:none;filter:blur(2px);opacity:.85}
  .gift{left:-30px;top:52%;width:110px}

  /* scene */
  .stage{position:relative;z-index:3;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:calc(var(--w)/1.7)}
  .env{position:relative;width:var(--w);aspect-ratio:1.7;perspective:1000px;cursor:pointer}
  .back{position:absolute;inset:0;border-radius:9px;background:linear-gradient(#f1a0bf,#ec92b5);box-shadow:0 22px 34px rgba(190,70,110,.28);z-index:0}

  .flap{position:absolute;left:0;top:0;width:100%;height:56%;z-index:3;transform-origin:50% 0;
        clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(#fab8d0,#f4a1c0);
        transition:transform .7s ease .75s,background .4s .75s,z-index 0s 1.1s}
  .open .flap{transform:rotateX(180deg);background:linear-gradient(#ec96b7,#e688ac);z-index:1;transition:transform .7s ease 0s,background .4s 0s,z-index 0s .35s}

  .lbox{position:absolute;inset:0;z-index:2;clip-path:inset(-300% -15% 0 -15%)}
  .letter{
    position:absolute;left:7%;width:86%;height:165%;top:8%;border-radius:16px;padding:7% 7% 0;
    background:linear-gradient(160deg,#fffaf0,#fdecdc);box-shadow:0 10px 26px rgba(150,60,90,.18),inset 0 0 0 1px rgba(255,255,255,.7);
    transform-origin:50% 100%;transition:top .8s ease 0s,transform .8s ease 0s;
  }
  .open .letter{top:-100%;transform:rotate(-2deg);transition:top .95s cubic-bezier(.2,.85,.25,1) .6s,transform .95s ease .6s}

  .hand{font-family:'Caveat',cursive;color:#3b2a38;font-weight:600;font-size:clamp(20px,6.3vw,27px);line-height:1.28;transform:rotate(-3.5deg);transform-origin:0 0}
  .hand .dear{font-size:1.2em;font-weight:700;margin-bottom:.45em;min-height:1.3em}
  .hand .body{white-space:pre-wrap;min-height:6em;padding-left:.2em}
  .typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;background:#9b1c4a;vertical-align:-.12em;animation:blink .7s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .endHeart{display:inline-block;width:1.1em;height:1.1em;margin-left:.3em;vertical-align:-.15em;fill:none;stroke:#d93a6a;stroke-width:2.4;opacity:0;transform:scale(.4);transition:opacity .4s,transform .5s cubic-bezier(.3,1.6,.5,1)}
  .done .endHeart{opacity:1;transform:scale(1)}

  .front{position:absolute;inset:0;width:100%;height:100%;z-index:3;border-radius:9px;pointer-events:none}
  .seal{position:absolute;left:50%;top:56%;width:19%;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 6px 6px rgba(120,20,50,.35));animation:hint 2s ease-in-out infinite}
  .open .seal{animation:crack .7s ease .05s 1}
  @keyframes hint{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
  @keyframes crack{0%{transform:translate(-50%,-50%) scale(1) rotate(0)}30%{transform:translate(-50%,-50%) scale(1.3) rotate(-8deg)}60%{transform:translate(-50%,-50%) scale(.92) rotate(5deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(0)}}

  .fh{position:absolute;left:50%;top:50%;width:18px;height:17px;fill:#f0306f;opacity:0;z-index:6;pointer-events:none}
  .open .fh{animation:rise 2.4s ease-out forwards}
  @keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-170px) scale(1.2)}}

  /* button bar */
  .bottom-actions{
    position:relative;z-index:4;align-self:center;margin-bottom:clamp(30px,6vh,65px);
    display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;
  }

  .cta{
    position:relative;z-index:4;align-self:center;width:min(58%,250px);height:clamp(50px,6vh,60px);
    border:0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(180deg,#e45f86,#b9305a);color:#fff;font:600 clamp(17px,4.8vw,21px) 'Nunito',sans-serif;
    box-shadow:0 12px 24px rgba(185,48,90,.38);transition:transform .15s, box-shadow .2s;
  }
  .cta:hover{transform:translateY(-2px);box-shadow:0 16px 28px rgba(185,48,90,.48)}
  .cta:active{transform:scale(.97)}
  .cta:focus-visible{outline:3px solid var(--crimson);outline-offset:3px}
  .cta svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

  .btn-celebrate-next{
    display:none;align-items:center;justify-content:center;gap:8px;
    padding:10px 24px;background:linear-gradient(90deg, #e8236f, #9b1c4a);color:#ffffff;
    border:0;border-radius:999px;font:700 14px 'Nunito',sans-serif;cursor:pointer;
    box-shadow:0 6px 18px rgba(232,35,111,0.35);animation:fadeIn 0.4s ease forwards;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  /* full letter sheet */
  .sheet{position:absolute;inset:0;z-index:8;display:flex;align-items:flex-end;background:rgba(122,22,70,0);pointer-events:none;transition:background .4s}
  .sheet.show{background:rgba(122,22,70,.35);pointer-events:auto}
  .paper{width:100%;max-height:88%;overflow:auto;padding:30px 28px 28px;border-radius:30px 30px 0 0;background:linear-gradient(170deg,#fffaf0,#fdecdc);
         transform:translateY(105%);transition:transform .55s cubic-bezier(.2,.85,.25,1);box-shadow:0 -14px 40px rgba(122,22,70,.25)}
  .show .paper{transform:translateY(0)}
  .paper h2{font-family:'Kaushan Script',cursive;font-weight:400;color:var(--crimson);font-size:30px;margin-bottom:14px}
  .paper .hand{transform:none;font-size:clamp(22px,6.4vw,27px)}
  .paper .hand p{margin-bottom:.7em;white-space:pre-wrap}
  
  .sheet-btn-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}
  .close{display:inline-block;padding:12px 26px;border:0;border-radius:999px;background:#f9d3e1;color:#9b1c4a;font:700 16px 'Nunito',sans-serif;cursor:pointer}
  .btn-sheet-celebrate{display:inline-block;padding:12px 28px;border:0;border-radius:999px;background:linear-gradient(90deg,#e8236f,#9b1c4a);color:#ffffff;font:700 16px 'Nunito',sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(232,35,111,0.35)}

  @media(prefers-reduced-motion:reduce){.mail,.divider svg,.seal,.cta svg{animation:none}}

  /* Embedded Mode inside Phone Mockup */
  body.embedded {
    background: transparent !important;
  }
  body.embedded .screen {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    background: radial-gradient(ellipse at 50% 40%,#fff0f6 0%,transparent 62%),linear-gradient(180deg,#f9cadc,#f8c6da 60%,#f9cde0) !important;
  }
  body.embedded .top-nav {
    display: none !important;
  }
  body.embedded .top {
    padding: 68px 16px 0 !important;
  }
  body.embedded h1 {
    font-size: 36px !important;
  }
  body.embedded .sub {
    font-size: 16px !important;
    margin-top: 4px !important;
  }
  body.embedded .mail {
    width: 44px !important;
    height: 38px !important;
    margin-bottom: 8px !important;
  }
  body.embedded .divider {
    margin-top: 14px !important;
  }
  body.embedded .bottom-actions {
    margin-bottom: 22px !important;
    gap: 8px !important;
  }
  body.embedded .cta {
    width: min(72%, 220px) !important;
    height: 48px !important;
    font-size: 15px !important;
  }
  body.embedded .cta svg {
    width: 20px !important;
    height: 20px !important;
  }
</style>
</head>
<body>
<div class="screen" id="screen">

  <!-- Top Nav Bar -->
  <div class="top-nav">
    <button type="button" class="btn-nav-back" id="btn-back">
      <span>←</span> Cut Cake
    </button>
  </div>

  <svg class="deco gift" viewBox="0 0 110 130" aria-hidden="true">
    <rect x="6" y="40" width="104" height="90" rx="4" fill="#fff4ee"/><rect x="40" y="40" width="22" height="90" fill="#f27fa7"/>
    <path d="M51 40C30 8 4 16 18 34c8 8 28 6 33 6zM51 40c21-32 47-24 33-6-8 8-28 6-33 6z" fill="#f48fb5"/>
  </svg>

  <div class="top">
    <svg class="mail" viewBox="0 0 56 46" aria-hidden="true">
      <rect x="3" y="3" width="50" height="40" rx="5"/><path d="M4 8l24 17L52 8"/>
      <path d="M28 33c-8-5-10-10-8-13 2-3 6-2 8 1 2-3 6-4 8-1 2 3 0 8-8 13z" fill="#9b1c4a" stroke="none"/>
    </svg>
    <h1>A Special Message</h1>
    <p class="sub">Just for You</p>
    <div class="divider"><i></i><svg viewBox="0 0 30 28" aria-hidden="true"><path d="M15 27C2 18 0 8 6 3.500c4-3 8-1 9 3 1-4 5-6 9-3 6 4.500 4 14.500-9 23.500z"/></svg><i></i></div>
  </div>

  <div class="stage">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Envelope. Tap to open or close.">
      <div class="back"></div>

      <div class="lbox">
        <div class="letter" id="letter">
          <div class="hand">
            <p class="dear" id="dear"></p>
            <p class="body" id="body"></p><svg class="endHeart" viewBox="0 0 30 28" aria-hidden="true"><path d="M15 26C3 18 1 9 6 4.500c4-3 8-1 9 3 1-4 5-6 9-3 5 4.500 3 13.500-9 21.500z"/></svg>
          </div>
        </div>
      </div>

      <div class="flap"></div>

      <svg class="front" viewBox="0 0 340 200" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="gL" x1="0" x2="1"><stop offset="0" stop-color="#f6aac6"/><stop offset="1" stop-color="#f9b8d0"/></linearGradient>
          <linearGradient id="gR" x1="1" x2="0"><stop offset="0" stop-color="#f4a2c0"/><stop offset="1" stop-color="#f8b4cd"/></linearGradient>
          <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbc2d6"/><stop offset="1" stop-color="#f7aac7"/></linearGradient>
        </defs>
        <path d="M0 0L170 112L0 200Z" fill="url(#gL)"/>
        <path d="M340 0L170 112L340 200Z" fill="url(#gR)"/>
        <path d="M0 200L170 112L340 200Z" fill="url(#gB)"/>
        <path d="M0 0L170 112L340 0M0 200L170 112L340 200" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.200"/>
      </svg>

      <svg class="seal" viewBox="0 0 100 92" aria-hidden="true">
        <defs>
          <linearGradient id="wax" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f06a85"/><stop offset="1" stop-color="#c9304f"/></linearGradient>
        </defs>
        <path d="M50 90C12 63 2 38 10 19 19 2 42 4 50 22 58 4 81 2 90 19c8 19-2 44-40 71z" fill="#c2314f"/>
        <path d="M50 82C20 59 12 38 18 24 25 11 43 12 50 27 57 12 75 11 82 24c6 14-2 35-32 58z" fill="url(#wax)"/>
        <path d="M50 70C32 56 28 42 33 34c5-7 14-5 17 2 3-7 12-9 17-2 5 8 1 22-17 36z" fill="#e9506f" stroke="#f58aa0" stroke-width="2"/>
        <path d="M26 30c2-6 8-9 13-8" stroke="#fff" stroke-opacity=".55" stroke-width="3.500" stroke-linecap="round" fill="none"/>
      </svg>

      <svg class="fh" style="--dx:-30px;animation-delay:.9s" viewBox="0 0 30 28"><path d="M15 27C2 18 0 8 6 3.500c4-3 8-1 9 3 1-4 5-6 9-3 6 4.500 4 14.500-9 23.500z"/></svg>
      <svg class="fh" style="--dx:24px;animation-delay:1.1s" viewBox="0 0 30 28"><path d="M15 27C2 18 0 8 6 3.500c4-3 8-1 9 3 1-4 5-6 9-3 6 4.500 4 14.500-9 23.500z"/></svg>
      <svg class="fh" style="--dx:-6px;animation-delay:1.3s" viewBox="0 0 30 28"><path d="M15 27C2 18 0 8 6 3.500c4-3 8-1 9 3 1-4 5-6 9-3 6 4.500 4 14.500-9 23.500z"/></svg>
      <svg class="fh" style="--dx:48px;animation-delay:1.5s" viewBox="0 0 30 28"><path d="M15 27C2 18 0 8 6 3.500c4-3 8-1 9 3 1-4 5-6 9-3 6 4.500 4 14.500-9 23.500z"/></svg>
      <svg class="fh" style="--dx:-52px;animation-delay:1.7s" viewBox="0 0 30 28"><path d="M15 27C2 18 0 8 6 3.500c4-3 8-1 9 3 1-4 5-6 9-3 6 4.500 4 14.500-9 23.500z"/></svg>
    </div>
  </div>

  <div class="bottom-actions">
    <button class="cta" id="more" type="button">Read More
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 14h20M16 6l8 8-8 8"/></svg>
    </button>
    <button class="btn-celebrate-next" id="btn-celebrate-next" type="button">
      Next: Birthday Wishes & Balloons 🎉 →
    </button>
  </div>

  <!-- full letter -->
  <div class="sheet" id="sheet">
    <div class="paper" role="dialog" aria-label="Full message">
      <h2>A Special Message</h2>
      <div class="hand" id="full"></div>
      <div class="sheet-btn-row">
        <button class="close" id="close" type="button">Close</button>
        <button class="btn-sheet-celebrate" id="btn-sheet-celebrate" type="button">Next: Birthday Wishes 🎉 →</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const q = new URLSearchParams(location.search);
  const to = q.get('to') || 'Sanjana';
  const from = q.get('from') || 'Rohan';
  const rel = q.get('rel') || '';
  const date = q.get('date') || '';
  const defaultMsg = 'Happy Birthday!\nYou mean a lot to me, and I’m so grateful to have you in my life. May this year bring you more happiness, success, and everything you wish for.';
  const msg = q.get('msg') || defaultMsg;
  const more = 'Here’s to laughter, cake, and every little moment that makes you smile. Thank you for being exactly who you are.';

  const isEmbedded = q.get('embedded') === '1' || (window.parent && window.parent !== window);
  if (isEmbedded) {
    document.body.classList.add('embedded');
  }

  // Back button handling
  const btnBack = $('#btn-back');
  if (btnBack) {
    btnBack.addEventListener('click', () => {
      if (window.parent && window.parent !== window) {
        if (typeof window.parent.switchToCakeView === 'function') {
          window.parent.switchToCakeView();
          return;
        }
      }
      location.href = 'cake.html?' + q.toString();
    });
  }

    // Celebration button handling (Navigates to Birthday Wishes & Balloons screen)
  function navigateToCelebration() {
    if (window.parent && window.parent !== window) {
      if (typeof window.parent.switchToWishesView === 'function') {
        window.parent.switchToWishesView();
        return;
      }
      window.parent.postMessage({ type: 'SAYBYME_SWITCH_VIEW', view: 'wishes' }, '*');
      return;
    }
    location.href = 'wishes.html?' + q.toString();
  }

  const btnCelebrateNext = $('#btn-celebrate-next');
  if (btnCelebrateNext) btnCelebrateNext.addEventListener('click', navigateToCelebration);
  const btnSheetCelebrate = $('#btn-sheet-celebrate');
  if (btnSheetCelebrate) btnSheetCelebrate.addEventListener('click', navigateToCelebration);

  const env = $('#env'), letter = $('#letter'), dear = $('#dear'), body = $('#body');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let run = 0;

  async function typeInto(el, text, speed, id) {
    el.classList.add('typing'); el.textContent = '';
    for (const ch of text) {
      if (id !== run) { el.classList.remove('typing'); return false; }
      el.textContent += ch;
      await sleep(ch === '\n' ? speed * 9 : ch === ' ' ? speed * .6 : speed);
    }
    el.classList.remove('typing'); return true;
  }

  async function openEnv() {
    const id = ++run;
    env.classList.add('open'); env.setAttribute('aria-expanded', 'true');
    letter.classList.remove('done'); dear.textContent = ''; body.textContent = '';
    await sleep(1700);
    if (id !== run) return;
    if (!(await typeInto(dear, 'Dear ' + to + ',', 55, id))) return;
    await sleep(250);
    if (!(await typeInto(body, msg, 38, id))) return;
    letter.classList.add('done');
    if (btnCelebrateNext) btnCelebrateNext.style.display = 'inline-flex';
  }

  async function closeEnv() {
    const id = ++run;
    env.classList.remove('open'); env.setAttribute('aria-expanded', 'false');
    letter.classList.remove('done'); dear.classList.remove('typing'); body.classList.remove('typing');
    await sleep(700);
    if (id === run) { dear.textContent = ''; body.textContent = ''; }
  }

  const toggle = () => env.classList.contains('open') ? closeEnv() : openEnv();
  env.addEventListener('click', toggle);
  env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });

  /* full letter */
  const full = $('#full');
  const mk = t => { const p = document.createElement('p'); p.textContent = t; return p; };
  full.append(mk('Dear ' + to + ','), ...msg.split('\n').map(mk), mk(more), mk('With love' + (from ? ',\n' + from : '') + ' ♡'));
  const sheet = $('#sheet');
  $('#more').addEventListener('click', () => sheet.classList.add('show'));
  $('#close').addEventListener('click', () => sheet.classList.remove('show'));
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.classList.remove('show'); });
  addEventListener('keydown', e => { if (e.key === 'Escape') sheet.classList.remove('show'); });

  setTimeout(openEnv, 700);
})();
</script>
</body>
</html>
