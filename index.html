<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SayByMe – Create a Birthday Surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Yellowtail&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#7a1646; --rose:#e8236f; --pink-1:#fde3ee; --pink-2:#f9c9dd;
    --ink:#3d1630; --field:#fff6fa; --border:#f3a9c6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(ellipse at 30% 25%, #fff0f6 0%, transparent 55%),
      radial-gradient(ellipse at 80% 60%, #fbd3e3 0%, transparent 60%),
      linear-gradient(160deg,#fde6f0,#f8c6dc);
    min-height:100vh;overflow-x:hidden;position:relative;
  }

  /* Stage wrapper */
  .stage{
    position:relative;min-height:100vh;max-width:1400px;margin:0 auto;
    overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }

  /* ---------- header ---------- */
  header{
    position:absolute;top:18px;left:0;right:0;text-align:center;z-index:10;
  }
  .logo{
    font-family:'Yellowtail',cursive;font-size:clamp(30px,2.8vw,44px);
    color:var(--plum);position:relative;display:inline-block;line-height:1;
  }
  .logo svg{position:absolute;right:-24px;top:-6px;width:22px;height:20px}
  .tag{
    margin-top:6px;font-size:clamp(11px,0.95vw,14px);font-weight:600;
    color:var(--ink);letter-spacing:.3px;
  }
  .tag i{color:var(--rose);font-style:normal;margin:0 10px;font-size:.85em}

  /* ---------- Glowing String Lights ---------- */
  .lights{position:absolute;top:0;width:30%;height:130px;z-index:2;pointer-events:none}
  .lights.l{left:0}.lights.r{right:0;transform:scaleX(-1)}

  /* ---------- centered main layout ---------- */
  main{
    position:relative;z-index:4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:100%;max-width:580px;margin:0 auto;
    padding:80px 20px 24px;text-align:center;
  }

  /* Reduced Teddy Bear & Cake on Top */
  .art{
    position:relative;width:100%;max-width:340px;height:180px;
    margin:0 auto 10px;
  }
  .art svg{position:absolute;overflow:visible}
  
  .cake{
    left:50%;bottom:0;width:190px;
    transform:translateX(-40%);
    z-index:2;
  }
  .bear{
    left:50%;bottom:0;width:130px;
    transform:translateX(-106%);
    z-index:3;
  }
  .gift-s{
    left:50%;bottom:2px;width:66px;
    transform:translateX(80%);
    z-index:1;
  }

  /* Panel / Entry section */
  .panel{
    width:100%;
    display:flex;flex-direction:column;align-items:center;
  }

  h1{
    font-family:'Kaushan Script',cursive;font-weight:400;color:var(--plum);
    font-size:clamp(38px,4.5vw,64px);line-height:1.05;
    position:relative;display:inline-block;transform:rotate(-1.5deg);
    margin-bottom:4px;
  }
  h1 .l2{display:block;margin-left:-8px}

  /* Outline hearts */
  .heart, h1 .heart{
    position:absolute;
    fill:none !important;
    stroke:var(--rose) !important;
    stroke-width:4.5;
  }
  h1 .h1a{top:-8px;right:-32px;width:clamp(26px,2.6vw,40px);transform:rotate(12deg)}
  h1 .h1b{top:38%;right:-42px;width:clamp(22px,2.2vw,34px);transform:rotate(15deg)}
  h1 .h1c{bottom:-8px;right:-6px;width:clamp(20px,2vw,30px)}
  
  .spark{
    position:absolute;left:-44px;top:14px;width:34px;
    stroke:var(--rose);stroke-width:4.5;stroke-linecap:round;
    fill:none !important;
  }

  .underline{
    display:block;width:78%;max-width:320px;height:14px;
    margin:2px auto 0 auto;
  }

  .sub{
    margin:14px auto 20px;font-size:clamp(14px,1.2vw,18px);line-height:1.5;
    max-width:26em;color:var(--ink);
  }

  form{width:100%}

  .field{
    display:flex;align-items:center;gap:14px;height:clamp(48px,4.5vw,60px);
    width:100%;max-width:440px;margin:0 auto 14px;
    padding:0 24px;border-radius:999px;background:var(--field);
    border:1.5px solid var(--border);box-shadow:0 6px 16px rgba(232,35,111,.08), inset 0 0 0 3px rgba(255,255,255,.6);
    transition:border-color .2s, box-shadow .2s;
  }
  .field:focus-within{border-color:var(--rose);box-shadow:0 0 0 4px rgba(232,35,111,.16)}
  .field svg{flex:none;width:24px;height:24px;stroke:var(--plum);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .field input{flex:1;border:0;outline:0;background:transparent;font:600 clamp(15px,1.25vw,18px) 'Nunito',sans-serif;color:var(--ink)}
  .field input::placeholder{color:#7b4a6a;font-weight:600}

  .cta-wrap{
    position:relative;width:100%;max-width:360px;margin:24px auto 0;
  }
  .cta{
    width:100%;height:clamp(48px,4.5vw,58px);border:0;border-radius:999px;cursor:pointer;
    background:linear-gradient(90deg,#f0306f,#c3237e 60%,#8d1a72);color:#fff;
    font:700 clamp(17px,1.5vw,22px) 'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;gap:12px;
    box-shadow:0 10px 22px rgba(193,35,110,.35);transition:transform .15s, box-shadow .15s;
  }
  .cta:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(193,35,110,.42)}
  .cta:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
  .cta svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  .burst{
    position:absolute;top:50%;width:26px;
    stroke:var(--rose);stroke-width:3;stroke-linecap:round;
    fill:none !important;pointer-events:none;
  }
  .burst.a{left:-36px;transform:translateY(-50%)}
  .burst.b{right:-36px;transform:translateY(-50%) scaleX(-1)}

  /* ---------- decorations ---------- */
  .deco{position:absolute;z-index:3;pointer-events:none}
  .balloon-heart{left:5%;top:12%;width:8%}
  .balloon-round{left:2%;top:26%;width:7%}
  .balloon-right{right:2%;top:16%;width:7.5%}

  .gift-l{left:2%;bottom:0;width:9.5%}
  .gift-r1{right:2%;bottom:0;width:9%}
  .gift-r2{right:11%;bottom:0;width:8%}

  .cloud{position:absolute;bottom:-70px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff3f8,#f7c0d8);filter:blur(3px);z-index:1;opacity:.85}
  .confetti{position:absolute;z-index:3;width:12px;height:18px;border-radius:3px;opacity:.85;animation:fall 7s ease-in-out infinite alternate}
  @keyframes fall{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(16px) rotate(calc(var(--r) + 30deg))}}
  .flame{transform-origin:50% 100%;animation:flicker 1.4s ease-in-out infinite alternate}
  @keyframes flicker{from{transform:scale(1,1)}to{transform:scale(.92,1.08) rotate(2deg)}}
  @media (prefers-reduced-motion:reduce){.confetti,.flame{animation:none}}

  /* ---------- responsive ---------- */
  @media (max-width:600px){
    body { overflow-x: hidden; }
    .stage { overflow-x: hidden; }
    header { top: 12px; padding: 0 45px; }
    .logo { font-size: clamp(26px, 7vw, 34px); }
    .tag { font-size: 11px; margin-top: 3px; }
    main { padding: 68px 16px 20px; width: 100%; box-sizing: border-box; }
    .art { max-width: 260px; height: 140px; }
    .cake { width: 145px; }
    .bear { width: 100px; }
    .gift-s { width: 48px; }
    h1 { font-size: clamp(32px, 8.5vw, 44px); }
    h1 .h1a { right: -16px; top: -6px; width: 22px; }
    h1 .h1b { right: -14px; width: 20px; }
    h1 .h1c { right: 0; bottom: -6px; width: 18px; }
    .spark { display: none; }
    .underline { width: 85%; }
    .sub { font-size: 14px; margin: 10px auto 16px; }
    .field { height: 48px; padding: 0 18px; font-size: 14px; }
    .field input { font-size: 15px; }
    .cta-wrap { max-width: 100%; margin: 18px auto 0; }
    .cta { height: 48px; font-size: 16px; }
    .burst.a { left: -14px; width: 18px; }
    .burst.b { right: -14px; width: 18px; }
    .deco { display: none; }
  }
</style>
</head>

        <ellipse cx="105" cy="300" rx="92" ry="100" fill="url(#fur)" stroke="#ecd0a0" stroke-width="2"/>

        <ellipse cx="105" cy="178" rx="88" ry="78" fill="url(#fur)" stroke="#ecd0a0" stroke-width="2" transform="rotate(8 105 178)"/>

    <!-- Centered panel -->
    <section class="panel">
      <h1>
        <svg class="spark" viewBox="0 0 46 60" aria-hidden="true"><path d="M30 6l4 16M8 30l18 8M6 52l16 2"/></svg>
        Create a

        <svg class="heart h1b" viewBox="0 0 60 56" aria-hidden="true"><path d="M30 52C4 34 2 14 16 8c8-3 14 2 14 8 0-6 6-11 14-8 14 6 12 26-14 44z"/></svg>
        <svg class="heart h1c" viewBox="0 0 60 56" aria-hidden="true"><path d="M30 52C4 34 2 14 16 8c8-3 14 2 14 8 0-6 6-11 14-8 14 6 12 26-14 44z"/></svg>

      <svg class="underline" viewBox="0 0 400 16" preserveAspectRatio="none" aria-hidden="true"><path d="M4 12C100 4 250 2 396 6" stroke="#f0306f" stroke-width="5" fill="none" stroke-linecap="round"/></svg>

      <p class="sub">Turn your wishes into a special birthday experience for someone you love.</p>

      <form onsubmit="event.preventDefault(); go();">
        <label class="field">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="11" r="6"/><path d="M5 28c1-7 6-10 11-10s10 3 11 10z"/></svg>

        <div class="cta-wrap">
          <svg class="burst a" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 22l8-6M12 6l4 8M2 12l9 1"/></svg>
          <button class="cta" type="submit">Let’s Create Magic
            <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 14h20M16 6l8 8-8 8"/></svg>
          </button>
          <svg class="burst b" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 22l8-6M12 6l4 8M2 12l9 1"/></svg>
        </div>
      </form>

<script>
  function go(){
    const from = document.getElementById('from').value.trim();
    const to = document.getElementById('to').value.trim();
    console.log({ from, to });
    window.location.href = 'step2.html?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to);
  }
</script>
